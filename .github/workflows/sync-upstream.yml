name: Sync from upstream
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add upstream remote
        run: |
          set -Eeuo pipefail
          git remote add upstream https://github.com/valentinfrlch/ha-llmvision.git
          git fetch upstream --prune --tags
          git fetch origin --prune --tags
      - name: Detect upstream default branch
        id: detect
        run: |
          set -Eeuo pipefail
          BRANCH="$(git ls-remote --symref upstream HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}')"
          if [ -z "$BRANCH" ]; then
            if git show-ref --verify --quiet refs/remotes/upstream/main; then
              BRANCH=main
            else
              BRANCH=master
            fi
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Rebase onto upstream
        id: rebase
        env:
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          set -Eeuo pipefail
          git checkout "$BRANCH" || git checkout -b "$BRANCH" "upstream/$BRANCH"
          git rebase "upstream/$BRANCH"
          echo "tip=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push to origin
        if: steps.rebase.outcome == 'success'
        env:
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          set -Eeuo pipefail
          git push origin "$BRANCH" --force-with-lease
      - name: Open issue on conflict
        if: failure() && steps.rebase.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sync needs manual rebase',
              body: `Scheduled rebase of ${{ steps.detect.outputs.branch }} onto upstream/${{ steps.detect.outputs.branch }} hit a conflict. Rebase by hand, then close this issue.`,
            });
